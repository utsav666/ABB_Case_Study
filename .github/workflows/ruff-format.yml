
name: Ruff Format and Quality Check

on:
  pull_request:
    paths:
      - '**.py'

jobs:
  ruff-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ruff
        # Pinned to match requirements.txt: an unpinned ruff can format
        # differently from the developer's version and fail a clean branch.
        run: pip install ruff==0.16.1 jq

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Lint code quality with Ruff (JSON output)
        run: ruff check . --output-format=json > ruff_output.json || true

      - name: Enforce 70% code quality threshold
        run: |
          total_files=$(find . -name "*.py" | wc -l)
          files_with_issues=$(jq -r '.[].filename' ruff_output.json | sort | uniq | wc -l)
          if [ "$total_files" -eq 0 ]; then
            echo "No Python files found."
            exit 1
          fi
          percent_passed=$((100 - (files_with_issues * 100 / total_files)))
          echo "Code quality pass percentage: $percent_passed%"
          if [ "$percent_passed" -lt 70 ]; then
            echo "Code quality below 70%. Merge not allowed."
            exit 1
          fi
