name: Test Coverage

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.coveragerc'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Match the runtime in the Dockerfile (public.ecr.aws/lambda/python:3.12)
      # so coverage reflects the version that actually ships.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The threshold lives in .coveragerc (fail_under = 50), so `coverage report`
      # exits non-zero on its own and fails this step. Keep the number in ONE
      # place — do not duplicate it here.
      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Enforce coverage threshold
        run: coverage report

      # Generated and uploaded even when the threshold check above fails —
      # that is exactly when you need to see which lines are uncovered.
      - name: Generate HTML report
        if: always()
        run: coverage html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
